<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>导入题库</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="back-link" href="index.html">返回</a>
      <h1>导入题库</h1>
    </div>

    <div class="card">
      <p class="group-title">导入 Markdown 题库</p>
      <p class="bank-progress-text" style="margin:0 0 6px;">题库名称（可留空，自动从 Markdown 一级标题读取）</p>
      <input type="text" id="bank-name" class="search-input" style="width:100%;margin-bottom:14px;" placeholder="例如：我的题库">

      <p class="bank-progress-text" style="margin:0 0 6px;">Markdown 内容（格式与「题库」文件夹里的 md 一致）</p>
      <textarea id="bank-md" class="md-input" placeholder="# 题库名

## 章节（可选）

### 1. 单选题

题干内容

- A. 选项A
- B. 选项B
- C. 选项C
- D. 选项D

**答案**：B
**解析**：解析内容"></textarea>

      <div class="btn-row">
        <button class="btn btn-primary" id="import-btn">导入题库</button>
      </div>
      <p id="import-msg" class="bank-progress-text" style="margin:12px 0 0;"></p>
    </div>

    <div class="card">
      <p class="group-title">格式说明</p>
      <div class="bank-progress-text">
        - 每道题以 <code>### 题号. 题型</code> 开头（题型：单选题 / 多选题 / 判断题）<br>
        - 选项写成 <code>- A. 内容</code>，判断题可省略（自动补「A 正确 / B 错误」）<br>
        - <code>**答案**：</code> 写答案，多选用顿号/逗号/空格分隔<br>
        - <code>**解析**：</code> 写解析（可省略）<br>
        - 有问题的题（缺选项、缺答案、答案越界等）会自动标记为异常并跳过
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/import.js"></script>
</body>
</html>
